      "text": "We sample three separately recorded semantic strata. \\emph{Within-dimension disagreement} occurs when reliable signals disagree about the same quality criterion. \\emph{Overall--dimension disagreement} indicates a possible mismatch in priorities or aggregation. \\emph{Cross-dimensional trade-offs} identify cases where different criteria favor different candidates; they are not contradictions between measurements of the same construct.",
