      "caption_in_manuscript": "The six-component evaluation program. Panel (a) adapts one candidate and permitted task evidence; (b) routes observations from an executable tool library; (c) applies dimension-specific criteria through evaluator modules; and (d) fuses sourced findings into a score and critique. The lower rail identifies the editable components. Human feedback supervises the outer evolution process, never the deployed scoring path. Evidence and judgment are separate objects.",
