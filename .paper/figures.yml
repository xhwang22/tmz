      "caption_in_manuscript": "A direction is a hypothesis, not an individual edit. Panel (a) illustrates a fixed-parent sequence of tool, routing, and interpretation changes, alongside separate best-program and working-program states. Panel (b) asks whether evidence was obtained, consumed, and interpreted before drawing a direction-level conclusion. Panel (c) distinguishes continuation, pause, resource exhaustion, and scoped refutation. This is a schematic search tree, not an observed optimization trajectory.",
