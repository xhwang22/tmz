      "caption_in_manuscript": "Three controlled uses of the evolved evaluator. Panel (a), C1, holds the candidate pool fixed and compares ranking and selection. Panel (b), C2, branches from a freshly generated shared $y_0$ and changes only the critic. Panel (c), C3, contrasts an unchanged Base policy with two policies trained under frozen rewards. The trained policies use matched inputs and compute but generate their own rollouts. Final judgments are blinded and external metrics are reserved from evolution. C3 is a planned training study, not an executed experiment.",
      "evidence_status": "Conceptual specification; no measured results"
    },
